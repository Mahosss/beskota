<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>beskota ✦ Aurora</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&family=Reem+Kufi:wght@400;600;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">

<style>
/* ================= Base ================= */
* {
  margin: 0; padding: 0; box-sizing: border-box;
  font-family: 'Tajawal', sans-serif;
}
:root {
  --aurora-1: #4ade80;
  --aurora-2: #22d3ee;
  --aurora-3: #a78bfa;
  --aurora-4: #f472b6;
  --bg: #050714;
  --glass: rgba(255,255,255,0.06);
  --glass-2: rgba(255,255,255,0.09);
  --border: rgba(255,255,255,0.14);
  --text: #eef2ff;
  --dim: #9aa3b8;
}

html, body { overflow-x: hidden; }

body {
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 40px 16px;
  position: relative;
  cursor: none;
  font-family: 'Tajawal', sans-serif;
}
@media (max-width: 768px) { body { cursor: auto; } .cursor, .cursor-dot { display: none; } }

/* ================= Custom Cursor ================= */
.cursor {
  position: fixed;
  width: 30px; height: 30px;
  border: 1.5px solid var(--aurora-2);
  border-radius: 50%;
  pointer-events: none;
  z-index: 9999;
  transform: translate(-50%, -50%);
  transition: transform 0.15s ease, background 0.2s, border-color 0.2s;
  box-shadow: 0 0 18px rgba(34,211,238,0.4);
  background: rgba(34,211,238,0.05);
}
.cursor-dot {
  position: fixed;
  width: 5px; height: 5px;
  background: var(--aurora-4);
  border-radius: 50%;
  pointer-events: none;
  z-index: 10000;
  transform: translate(-50%, -50%);
  box-shadow: 0 0 10px var(--aurora-4);
}
.cursor.grow {
  transform: translate(-50%, -50%) scale(1.7);
  background: rgba(167,139,250,0.18);
  border-color: var(--aurora-3);
}

/* ================= Aurora Background ================= */
.aurora-bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  background: var(--bg);
}
.aurora-blob {
  position: absolute;
  border-radius: 50%;
  filter: blur(120px);
  opacity: 0.55;
  animation: auroraFloat 22s ease-in-out infinite;
}
.aurora-blob.a1 {
  width: 550px; height: 550px;
  background: var(--aurora-1);
  top: -150px; right: -100px;
  animation-delay: 0s;
}
.aurora-blob.a2 {
  width: 500px; height: 500px;
  background: var(--aurora-3);
  bottom: -180px; left: -120px;
  animation-delay: -7s;
}
.aurora-blob.a3 {
  width: 450px; height: 450px;
  background: var(--aurora-2);
  top: 40%; left: 40%;
  opacity: 0.4;
  animation-delay: -14s;
}
.aurora-blob.a4 {
  width: 350px; height: 350px;
  background: var(--aurora-4);
  top: 20%; left: 10%;
  opacity: 0.35;
  animation-delay: -3s;
}
@keyframes auroraFloat {
  0%,100% { transform: translate(0,0) scale(1); }
  33%     { transform: translate(60px,-40px) scale(1.15); }
  66%     { transform: translate(-40px,60px) scale(0.9); }
}

/* Stars overlay */
.stars {
  position: absolute;
  inset: 0;
  background-image:
    radial-gradient(1px 1px at 20px 30px, #fff, transparent),
    radial-gradient(1px 1px at 40px 70px, #fff, transparent),
    radial-gradient(1.5px 1.5px at 90px 40px, #fff, transparent),
    radial-gradient(1px 1px at 130px 80px, #fff, transparent),
    radial-gradient(1px 1px at 160px 120px, #fff, transparent),
    radial-gradient(1.5px 1.5px at 200px 60px, #fff, transparent);
  background-size: 250px 200px;
  background-repeat: repeat;
  opacity: 0.6;
  animation: twinkle 4s ease-in-out infinite;
}
@keyframes twinkle {
  0%,100% { opacity: 0.4; }
  50%     { opacity: 0.8; }
}

/* ================= Card ================= */
.card {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 560px;
  background: var(--glass);
  backdrop-filter: blur(28px) saturate(160%);
  -webkit-backdrop-filter: blur(28px) saturate(160%);
  border: 1px solid var(--border);
  border-radius: 28px;
  padding: 0 0 36px;
  overflow: hidden;
  box-shadow:
    0 30px 80px rgba(0,0,0,0.5),
    0 0 0 1px rgba(255,255,255,0.04) inset,
    0 0 80px rgba(34,211,238,0.08);
  animation: cardRise 1.2s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes cardRise {
  from { opacity: 0; transform: translateY(40px) scale(0.96); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

/* Card subtle top highlight */
.card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
}

/* ================= Top Banner ================= */
.banner {
  height: 150px;
  position: relative;
  overflow: hidden;
  background:
    linear-gradient(135deg, rgba(74,222,128,0.3), rgba(167,139,250,0.3), rgba(34,211,238,0.3)),
    url('https://img.alfrsantv.com/img/f176636174587211.jpg') center/cover;
  background-blend-mode: overlay;
}
.banner::after {
  content: '';
  position: absolute;
  inset: 0;
  background:
    linear-gradient(180deg, transparent 40%, rgba(5,7,20,0.9) 100%),
    linear-gradient(45deg, rgba(167,139,250,0.2), transparent 60%);
}

/* Grain */
.banner .grain {
  position: absolute;
  inset: 0;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><filter id='n'><feTurbulence baseFrequency='0.9'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.5'/></svg>");
  opacity: 0.15;
  mix-blend-mode: overlay;
}

/* ================= Avatar ================= */
.avatar-wrap {
  position: relative;
  width: 130px; height: 130px;
  margin: -65px auto 0;
  z-index: 3;
}
.avatar-glow {
  position: absolute;
  inset: -8px;
  border-radius: 50%;
  background: conic-gradient(from 0deg, var(--aurora-1), var(--aurora-2), var(--aurora-3), var(--aurora-4), var(--aurora-1));
  animation: spin 8s linear infinite;
  filter: blur(8px);
  opacity: 0.8;
}
@keyframes spin { to { transform: rotate(360deg); } }

.avatar {
  position: relative;
  width: 100%; height: 100%;
  border-radius: 50%;
  background: var(--bg);
  padding: 4px;
  overflow: hidden;
  z-index: 1;
  transition: transform 0.5s cubic-bezier(.2,.9,.3,1.5);
}
.avatar:hover { transform: scale(1.06); }
.avatar img {
  width: 100%; height: 100%;
  border-radius: 50%;
  object-fit: cover;
  display: block;
  user-select: none; pointer-events: none;
}

/* Online dot */
.status {
  position: absolute;
  bottom: 6px; left: 6px;
  width: 20px; height: 20px;
  background: #22c55e;
  border: 3px solid #0a0e1f;
  border-radius: 50%;
  z-index: 4;
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%,100% { box-shadow: 0 0 0 0 rgba(34,197,94,0.7); }
  50%     { box-shadow: 0 0 0 10px rgba(34,197,94,0); }
}

/* ================= Header ================= */
.header {
  text-align: center;
  padding: 20px 26px 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}

.name {
  font-family: 'Space Grotesk', 'Reem Kufi', sans-serif;
  font-size: 38px;
  font-weight: 700;
  letter-spacing: 1px;
  background: linear-gradient(100deg, #fff 20%, var(--aurora-2) 45%, var(--aurora-3) 70%, var(--aurora-4) 90%);
  background-size: 240% auto;
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  animation: shineText 5s linear infinite;
  line-height: 1.2;
}
@keyframes shineText { to { background-position: 240% center; } }

.verify {
  font-size: 20px;
  -webkit-text-fill-color: var(--aurora-2);
  color: var(--aurora-2);
  filter: drop-shadow(0 0 10px var(--aurora-2));
}

.tagline {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-size: 13px;
  color: var(--dim);
  letter-spacing: 1.5px;
  padding: 6px 16px;
  border-radius: 20px;
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--border);
  transition: all 0.3s ease;
}
.tagline:hover {
  background: rgba(34,211,238,0.12);
  border-color: var(--aurora-2);
  color: var(--text);
  box-shadow: 0 0 22px rgba(34,211,238,0.3);
}
.tagline i {
  color: var(--aurora-2);
  filter: drop-shadow(0 0 6px var(--aurora-2));
}

.typed {
  font-size: 13px;
  color: var(--aurora-1);
  min-height: 18px;
  letter-spacing: 0.5px;
  margin: 0;
  text-shadow: 0 0 10px rgba(74,222,128,0.5);
}
.typed::after {
  content: '|';
  color: var(--aurora-4);
  animation: blink 1s steps(1) infinite;
  margin-right: 2px;
}
@keyframes blink { 50% { opacity: 0; } }

/* ================= Glass Info Cards ================= */
.info-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  padding: 0 22px;
  margin-top: 24px;
}
.info-card {
  background: var(--glass-2);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 16px 8px 14px;
  text-align: center;
  transition: all 0.35s ease;
  position: relative;
  overflow: hidden;
  backdrop-filter: blur(10px);
}
.info-card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at var(--x,50%) var(--y,50%), rgba(34,211,238,0.15), transparent 60%);
  opacity: 0;
  transition: opacity 0.35s;
}
.info-card:hover::before { opacity: 1; }
.info-card:hover {
  transform: translateY(-5px);
  border-color: var(--aurora-2);
  box-shadow: 0 15px 30px rgba(34,211,238,0.2);
  background: rgba(255,255,255,0.1);
}
.info-card .ic {
  font-size: 18px;
  color: var(--aurora-2);
  filter: drop-shadow(0 0 8px rgba(34,211,238,0.6));
}
.info-card .val {
  display: block;
  margin-top: 8px;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: 0.3px;
}
.info-card .lb {
  font-size: 10.5px;
  color: var(--dim);
  margin-top: 3px;
  letter-spacing: 1.2px;
  text-transform: uppercase;
}

/* ================= Mood Player ================= */
.player {
  margin: 22px 22px 0;
  padding: 14px 18px;
  border-radius: 16px;
  background: linear-gradient(135deg, rgba(74,222,128,0.08), rgba(167,139,250,0.08));
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 14px;
  backdrop-filter: blur(10px);
}
.player .art {
  width: 44px; height: 44px;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--aurora-3), var(--aurora-2));
  display: grid;
  place-items: center;
  color: #0a0e1f;
  font-size: 16px;
  flex-shrink: 0;
  box-shadow: 0 0 18px rgba(167,139,250,0.4);
}
.player .art i { animation: beat 1.6s infinite; }
@keyframes beat {
  0%,100% { transform: scale(1); }
  50%     { transform: scale(1.15); }
}
.player .info {
  flex: 1;
  min-width: 0;
}
.player .track {
  font-size: 13.5px;
  font-weight: 600;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.player .artist {
  font-size: 11px;
  color: var(--dim);
  margin-top: 2px;
}
.player .controls {
  display: flex;
  gap: 6px;
}
.player .controls button {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: rgba(255,255,255,0.06);
  border: 1px solid var(--border);
  color: var(--text);
  font-size: 11px;
  cursor: none;
  transition: all 0.3s ease;
  display: grid;
  place-items: center;
}
.player .controls button:hover {
  background: var(--aurora-2);
  color: #0a0e1f;
  border-color: var(--aurora-2);
  box-shadow: 0 0 14px rgba(34,211,238,0.5);
}

/* Progress bar */
.progress {
  margin: 8px 22px 0;
  height: 3px;
  background: rgba(255,255,255,0.08);
  border-radius: 3px;
  overflow: hidden;
}
.progress span {
  display: block;
  height: 100%;
  width: 40%;
  background: linear-gradient(90deg, var(--aurora-1), var(--aurora-2), var(--aurora-3));
  border-radius: 3px;
  box-shadow: 0 0 10px var(--aurora-2);
  animation: progressMove 8s linear infinite;
}
@keyframes progressMove {
  from { width: 0%; }
  to   { width: 100%; }
}

/* ================= Quote Section ================= */
.quote-section {
  margin: 24px 22px 0;
  padding: 20px 22px;
  border-radius: 18px;
  background: var(--glass-2);
  border: 1px solid var(--border);
  position: relative;
  backdrop-filter: blur(10px);
  transition: opacity 0.4s ease;
}
.quote-section::before {
  content: '\f10d';
  font-family: 'Font Awesome 6 Free';
  font-weight: 900;
  position: absolute;
  top: -12px; right: 22px;
  color: var(--aurora-3);
  background: #0a0e1f;
  padding: 3px 10px;
  border-radius: 10px;
  font-size: 12px;
  box-shadow: 0 0 14px rgba(167,139,250,0.5);
}
.quote-section p {
  font-size: 15px;
  line-height: 2;
  color: var(--text);
  text-align: center;
}
.quote-section p i { color: var(--aurora-4); margin-left: 4px; }

.quote-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin: 16px auto 0;
  padding: 9px 22px;
  border-radius: 24px;
  background: linear-gradient(135deg, var(--aurora-3), var(--aurora-2));
  color: #0a0e1f;
  border: none;
  font-size: 12.5px;
  font-weight: 700;
  cursor: none;
  transition: all 0.35s ease;
  box-shadow: 0 8px 22px rgba(34,211,238,0.25);
  font-family: 'Tajawal', sans-serif;
  letter-spacing: 0.5px;
}
.quote-btn:hover {
  transform: translateY(-3px) scale(1.03);
  box-shadow: 0 14px 32px rgba(34,211,238,0.45);
}
.quote-btn i { font-size: 12px; }

/* ================= Social ================= */
.social {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin: 26px 22px 0;
  flex-wrap: wrap;
}
.social a {
  position: relative;
  width: 44px; height: 44px;
  display: grid;
  place-items: center;
  border-radius: 13px;
  color: var(--text);
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--border);
  font-size: 16px;
  text-decoration: none;
  transition: all 0.35s cubic-bezier(.2,.9,.3,1.4);
  overflow: hidden;
  backdrop-filter: blur(6px);
}
.social a::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, var(--aurora-2), var(--aurora-3));
  opacity: 0;
  transition: opacity 0.35s;
}
.social a i { position: relative; z-index: 1; }
.social a:hover {
  transform: translateY(-5px) rotate(-5deg);
  color: #0a0e1f;
  border-color: transparent;
  box-shadow: 0 12px 26px rgba(34,211,238,0.4);
}
.social a:hover::before { opacity: 1; }

/* ================= Footer ================= */
.footer {
  text-align: center;
  margin-top: 26px;
  font-size: 11.5px;
  color: var(--dim);
  letter-spacing: 1.5px;
  text-transform: uppercase;
}
.footer i { color: var(--aurora-4); animation: beat 1.4s infinite; }

/* ================= Responsive ================= */
@media (max-width: 500px) {
  body { padding: 20px 10px; }
  .card { border-radius: 22px; }
  .banner { height: 130px; }
  .avatar-wrap { width: 110px; height: 110px; margin-top: -55px; }
  .name { font-size: 28px; }
  .info-grid { gap: 8px; padding: 0 14px; }
  .info-card .val { font-size: 13px; }
  .player, .quote-section, .social, .progress { margin-left: 14px; margin-right: 14px; }
  .quote-section p { font-size: 13.5px; }
}
</style>
</head>
<body>

<!-- Custom Cursor -->
<div class="cursor"></div>
<div class="cursor-dot"></div>

<!-- Aurora Background -->
<div class="aurora-bg">
  <div class="aurora-blob a1"></div>
  <div class="aurora-blob a2"></div>
  <div class="aurora-blob a3"></div>
  <div class="aurora-blob a4"></div>
  <div class="stars"></div>
</div>

<!-- Main Card -->
<main class="card">

  <!-- Banner -->
  <div class="banner">
    <div class="grain"></div>
  </div>

  <!-- Avatar -->
  <div class="avatar-wrap">
    <div class="avatar-glow"></div>
    <div class="avatar">
      <img src="https://img.alfrsantv.com/img/f176635888499821.png" alt="صورة beskota">
    </div>
    <span class="status" title="متصل الآن"></span>
  </div>

  <!-- Header -->
  <header class="header">
    <h1 class="name">
      beskota
      <i class="fas fa-circle-check verify" title="موثق"></i>
    </h1>
    <p class="tagline"><i class="fas fa-bolt"></i> AURORA VIBES</p>
    <p class="typed" id="typed"></p>
  </header>

  <!-- Info Cards -->
  <section class="info-grid">
    <div class="info-card">
      <i class="fas fa-location-dot ic"></i>
      <span class="val">مصر</span>
      <span class="lb">البلد</span>
    </div>
    <div class="info-card">
      <i class="fas fa-crown ic"></i>
      <span class="val" id="titleOfDay">ملكة</span>
      <span class="lb">لقب اليوم</span>
    </div>
    <div class="info-card">
      <i class="fas fa-face-smile ic" id="moodIcon"></i>
      <span class="val" id="moodText">سعيدة</span>
      <span class="lb">المزاج</span>
    </div>
  </section>

  <!-- Mood Player -->
  <div class="player">
    <div class="art"><i class="fas fa-music"></i></div>
    <div class="info">
      <div class="track" id="trackName">Midnight Vibes</div>
      <div class="artist">Aurora Beats · 2025</div>
    </div>
    <div class="controls">
      <button title="السابق"><i class="fas fa-backward"></i></button>
      <button title="تشغيل" id="playBtn"><i class="fas fa-play"></i></button>
      <button title="التالي"><i class="fas fa-forward"></i></button>
    </div>
  </div>
  <div class="progress"><span></span></div>

  <!-- Quote -->
  <div class="quote-section" id="quoteBox">
    <p id="quoteText">أحبك فقط بسبب شخصيتك، وليس لما تمتلكه <i class="fas fa-heart"></i></p>
  </div>

  <button class="quote-btn" id="quoteBtn">
    <i class="fas fa-wand-magic-sparkles"></i>
    اقتباس جديد
  </button>

  <!-- Social -->
  <div class="social">
    <a href="#" title="YouTube"><i class="fab fa-youtube"></i></a>
    <a href="#" title="Instagram"><i class="fab fa-instagram"></i></a>
    <a href="#" title="TikTok"><i class="fab fa-tiktok"></i></a>
    <a href="#" title="Telegram"><i class="fab fa-telegram"></i></a>
    <a href="#" title="WhatsApp"><i class="fab fa-whatsapp"></i></a>
  </div>

  <!-- Footer -->
  <p class="footer">Aurora Edition · Made for beskota <i class="fas fa-heart"></i></p>

</main>

<script>
/* ============ Custom Cursor ============ */
const cursor = document.querySelector('.cursor');
const dot = document.querySelector('.cursor-dot');
let mx = window.innerWidth / 2, my = window.innerHeight / 2;
let cx = mx, cy = my;
cursor.style.left = cx + 'px';
cursor.style.top  = cy + 'px';
dot.style.left = mx + 'px';
dot.style.top  = my + 'px';

document.addEventListener('mousemove', e => {
  mx = e.clientX; my = e.clientY;
  dot.style.left = mx + 'px';
  dot.style.top  = my + 'px';
});
function animateCursor() {
  cx += (mx - cx) * 0.18;
  cy += (my - cy) * 0.18;
  cursor.style.left = cx + 'px';
  cursor.style.top  = cy + 'px';
  requestAnimationFrame(animateCursor);
}
animateCursor();

document.querySelectorAll('a, button, .info-card, .avatar, .social a').forEach(el => {
  el.addEventListener('mouseenter', () => cursor.classList.add('grow'));
  el.addEventListener('mouseleave', () => cursor.classList.remove('grow'));
});

/* ============ Info Cards Highlight Follow Mouse ============ */
document.querySelectorAll('.info-card').forEach(card => {
  card.addEventListener('mousemove', e => {
    const r = card.getBoundingClientRect();
    card.style.setProperty('--x', (e.clientX - r.left) + 'px');
    card.style.setProperty('--y', (e.clientY - r.top)  + 'px');
  });
});

/* ============ Typing Effect ============ */
const typedEl = document.getElementById('typed');
const lines = [
  'مرحبًا بيك في بروفايلي ✨',
  'Aurora Vibes 🌌',
  'أنيقة · مبدعة · مميزة',
];
let li = 0, ci = 0, deleting = false;
function typeLoop() {
  const current = lines[li];
  if (!deleting) {
    typedEl.textContent = current.slice(0, ++ci);
    if (ci === current.length) { deleting = true; return setTimeout(typeLoop, 1800); }
  } else {
    typedEl.textContent = current.slice(0, --ci);
    if (ci === 0) { deleting = false; li = (li + 1) % lines.length; }
  }
  setTimeout(typeLoop, deleting ? 45 : 85);
}
setTimeout(typeLoop, 400);

/* ============ Title of the day ============ */
const titles = ['ملكة', 'أميرة', 'نجمة', 'فراشة', 'قمر', 'ياقوتة'];
document.getElementById('titleOfDay').textContent = titles[new Date().getDate() % titles.length];

  { t: 'حالمة', i: 'fa-face-grin-hearts' },

];
const m = moods[new Date().getDate() % moods.length];

  'كوني وردة في زحمة العابرين 🌹',
  'الحب الحقيقي يخليك أحسن نسخة من نفسك ✨',

/* ============ Play button toggle ============ */
const playBtn = document.getElementById('playBtn');
let playing = false;
playBtn.addEventListener('click', () => {
  playing = !playing;
  playBtn.innerHTML = playing
    ? '<i class="fas fa-pause"></i>'
    : '<i class="fas fa-play"></i>';
});
