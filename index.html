<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>beskota ✦ Mobile</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">

<style>
/* ================= Base ================= */
* {
  margin: 0; padding: 0; box-sizing: border-box;
  font-family: 'Tajawal', sans-serif;
}
:root {
  --purple: #7c3aed;
  --purple-light: #a78bfa;
  --blue: #3b82f6;
  --blue-light: #60a5fa;
  --pink: #ec4899;
  --bg: #0a0a14;
  --phone-bg: #12121e;
  --screen-bg: #0f0f1a;
  --screen-2: #1a1a2e;
  --text: #eef2ff;
  --dim: #9aa3b8;
  --border: rgba(167,139,250,0.18);
}

html, body { overflow-x: hidden; }

body {
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 30px 15px;
  position: relative;
}

/* ================= Ambient Background ================= */
.bg-ambient {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  background: var(--bg);
}
.bg-ambient::before {
  content: '';
  position: absolute;
  width: 500px; height: 500px;
  background: radial-gradient(circle, var(--purple), transparent 70%);
  filter: blur(120px);
  opacity: 0.3;
  top: -100px; left: -100px;
  animation: floatAmb 18s ease-in-out infinite;
}
.bg-ambient::after {
  content: '';
  position: absolute;
  width: 450px; height: 450px;
  background: radial-gradient(circle, var(--blue), transparent 70%);
  filter: blur(120px);
  opacity: 0.25;
  bottom: -100px; right: -100px;
  animation: floatAmb 18s ease-in-out infinite reverse;
}
@keyframes floatAmb {
  0%,100% { transform: translate(0,0) scale(1); }
  50%     { transform: translate(60px,-40px) scale(1.2); }
}

/* ================= Phone Wrapper ================= */
.phone-wrap {
  position: relative;
  z-index: 1;
  animation: phoneIn 1.2s cubic-bezier(.2,.9,.3,1.1);
}
@keyframes phoneIn {
  from { opacity: 0; transform: translateY(50px) scale(0.94); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

/* ================= Phone Body ================= */
.phone {
  position: relative;
  width: 380px;
  height: 780px;
  background: linear-gradient(145deg, #1a1a24, #0d0d15);
  border-radius: 48px;
  padding: 12px;
  box-shadow:
    0 50px 100px rgba(0,0,0,0.7),
    0 0 0 2px rgba(255,255,255,0.04) inset,
    0 0 80px rgba(124,58,237,0.15);
  position: relative;
}
/* Side buttons */
.phone::before {
  content: '';
  position: absolute;
  top: 130px; left: -3px;
  width: 3px; height: 60px;
  background: linear-gradient(180deg, #2a2a3a, #1a1a24);
  border-radius: 3px 0 0 3px;
  box-shadow: 0 80px 0 #2a2a3a, 0 160px 0 #2a2a3a;
}
.phone::after {
  content: '';
  position: absolute;
  top: 150px; right: -3px;
  width: 3px; height: 90px;
  background: linear-gradient(180deg, #2a2a3a, #1a1a24);
  border-radius: 0 3px 3px 0;
}

/* Notch */
.notch {
  position: absolute;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  width: 120px;
  height: 26px;
  background: #000;
  border-radius: 0 0 20px 20px;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.notch::before {
  content: '';
  width: 42px;
  height: 5px;
  background: #1a1a24;
  border-radius: 5px;
}
.notch::after {
  content: '';
  width: 7px;
  height: 7px;
  background: radial-gradient(circle at 30% 30%, #2a2a4a, #000);
  border-radius: 50%;
  border: 1px solid #1a1a24;
}

/* ================= Screen ================= */
.screen {
  position: relative;
  width: 100%;
  height: 100%;
  background: var(--screen-bg);
  border-radius: 38px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* Status Bar */
.status-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 24px 8px;
  font-size: 12px;
  font-weight: 600;
  color: var(--text);
  position: relative;
  z-index: 5;
  background: transparent;
}
.status-bar .right,
.status-bar .left {
  display: flex;
  align-items: center;
  gap: 6px;
}
.status-bar i { font-size: 11px; }
.status-bar .battery {
  width: 20px; height: 10px;
  border: 1px solid var(--text);
  border-radius: 3px;
  position: relative;
  padding: 1px;
}
.status-bar .battery::after {
  content: '';
  position: absolute;
  right: -3px; top: 50%;
  transform: translateY(-50%);
  width: 2px; height: 4px;
  background: var(--text);
  border-radius: 0 1px 1px 0;
}
.status-bar .battery span {
  display: block;
  height: 100%;
  width: 75%;
  background: var(--text);
  border-radius: 1px;
}

/* ================= Screen Content ================= */
.screen-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  scrollbar-width: none;
  padding-bottom: 80px;
}
.screen-content::-webkit-scrollbar { display: none; }

/* ================= Profile Header ================= */
.profile-header {
  position: relative;
  padding: 12px 20px 20px;
  text-align: center;
}
.profile-cover {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 130px;
  background:
    linear-gradient(135deg, rgba(124,58,237,0.5), rgba(59,130,246,0.5)),
    url('https://img.alfrsantv.com/img/f176636174587211.jpg') center/cover;
  background-blend-mode: overlay;
  z-index: 0;
  overflow: hidden;
}
.profile-cover::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, transparent 30%, var(--screen-bg) 100%);
}

.profile-info {
  position: relative;
  z-index: 1;
  padding-top: 70px;
}

.avatar-lg {
  width: 100px; height: 100px;
  margin: 0 auto;
  border-radius: 50%;
  border: 4px solid var(--screen-bg);
  padding: 0;
  overflow: hidden;
  position: relative;
  box-shadow: 0 0 0 2px var(--purple), 0 8px 24px rgba(124,58,237,0.4);
  background: var(--screen-bg);
}
.avatar-lg img {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
  user-select: none;
  pointer-events: none;
}
.avatar-lg .online {
  position: absolute;
  bottom: 4px; right: 4px;
  width: 18px; height: 18px;
  background: #22c55e;
  border: 3px solid var(--screen-bg);
  border-radius: 50%;
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%,100% { box-shadow: 0 0 0 0 rgba(34,197,94,0.6); }
  50%     { box-shadow: 0 0 0 8px rgba(34,197,94,0); }
}

.profile-name {
  font-family: 'Cairo', sans-serif;
  font-size: 22px;
  font-weight: 800;
  color: var(--text);
  margin-top: 12px;
  letter-spacing: 0.5px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.profile-name .verify {
  color: var(--purple-light);
  font-size: 14px;
  filter: drop-shadow(0 0 6px var(--purple));
}
.profile-handle {
  font-size: 12.5px;
  color: var(--dim);
  margin-top: 3px;
  letter-spacing: 0.5px;
}
.profile-bio {
  font-size: 12.5px;
  color: var(--text);
  margin-top: 10px;
  line-height: 1.6;
  padding: 0 12px;
  opacity: 0.85;
}
.profile-bio i { color: var(--pink); }

/* Stats row (Instagram-like) */
.stats {
  display: flex;
  justify-content: center;
  gap: 32px;
  margin-top: 16px;
  padding: 0 10px;
}
.stat {
  text-align: center;
}
.stat .num {
  font-family: 'Cairo', sans-serif;
  font-size: 17px;
  font-weight: 800;
  color: var(--text);
}
.stat .lb {
  font-size: 11px;
  color: var(--dim);
  margin-top: 2px;
}

/* Action buttons */
.actions-row {
  display: flex;
  gap: 8px;
  margin-top: 16px;
  padding: 0 12px;
}
.btn-action {
  flex: 1;
  padding: 10px;
  border-radius: 12px;
  border: none;
  font-family: 'Cairo', sans-serif;
  font-size: 12.5px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.3s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.btn-primary {
  background: linear-gradient(135deg, var(--purple), var(--blue));
  color: #fff;
  box-shadow: 0 4px 12px rgba(124,58,237,0.4);
}
.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(124,58,237,0.6);
}
.btn-secondary {
  background: rgba(255,255,255,0.06);
  color: var(--text);
  border: 1px solid var(--border);
}
.btn-secondary:hover {
  background: rgba(167,139,250,0.15);
  border-color: var(--purple);
}

/* ================= Info Cards Row ================= */
.info-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  padding: 0 20px;
  margin-top: 20px;
}
.info-tile {
  background: linear-gradient(150deg, rgba(167,139,250,0.08), rgba(59,130,246,0.05));
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 12px 6px 10px;
  text-align: center;
  transition: all 0.3s ease;
}
.info-tile:hover {
  border-color: var(--purple);
  background: linear-gradient(150deg, rgba(167,139,250,0.15), rgba(59,130,246,0.1));
  transform: translateY(-3px);
}
.info-tile i {
  font-size: 15px;
  color: var(--purple-light);
  filter: drop-shadow(0 0 6px var(--purple));
}
.info-tile .val {
  display: block;
  font-family: 'Cairo', sans-serif;
  font-size: 12.5px;
  font-weight: 700;
  color: var(--text);
  margin-top: 6px;
}
.info-tile .lb {
  font-size: 9.5px;
  color: var(--dim);
  margin-top: 2px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}

/* ================= Stories Row ================= */
.stories {
  display: flex;
  gap: 12px;
  padding: 18px 20px 0;
  overflow-x: auto;
  scrollbar-width: none;
}
.stories::-webkit-scrollbar { display: none; }
.story {
  flex-shrink: 0;
  text-align: center;
  cursor: pointer;
  transition: transform 0.3s;
}
.story:hover { transform: scale(1.05); }
.story-ring {
  width: 58px; height: 58px;
  border-radius: 50%;
  padding: 2.5px;
  background: linear-gradient(135deg, var(--purple), var(--blue), var(--pink));
  position: relative;
  box-shadow: 0 0 12px rgba(124,58,237,0.3);
}
.story-ring::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 50%;
  padding: 2.5px;
  background: var(--screen-bg);
  z-index: 1;
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
          mask-composite: exclude;
  pointer-events: none;
}
.story-ring .img {
  width: 100%; height: 100%;
  border-radius: 50%;
  overflow: hidden;
  position: relative;
  z-index: 2;
}
.story-ring .img img {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
}
.story .name {
  font-size: 10px;
  color: var(--dim);
  margin-top: 5px;
  max-width: 60px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* ================= Quote Card ================= */
.quote-card {
  margin: 20px 20px 0;
  padding: 18px 18px;
  border-radius: 16px;
  background: linear-gradient(135deg, rgba(124,58,237,0.15), rgba(59,130,246,0.1));
  border: 1px solid var(--border);
  position: relative;
  text-align: center;
}
.quote-card::before {
  content: '\f10d';
  font-family: 'Font Awesome 6 Free';
  font-weight: 900;
  position: absolute;
  top: -10px; right: 16px;
  color: var(--purple-light);
  background: var(--screen-bg);
  padding: 2px 8px;
  border-radius: 8px;
  font-size: 11px;
  box-shadow: 0 0 10px var(--purple);
}
.quote-card p {
  font-size: 13px;
  line-height: 1.9;
  color: var(--text);
  transition: opacity 0.4s;
}
.quote-card p i { color: var(--pink); }
.quote-refresh {
  margin-top: 10px;
  background: none;
  border: 1px solid var(--border);
  color: var(--purple-light);
  font-size: 10.5px;
  padding: 5px 12px;
  border-radius: 20px;
  cursor: pointer;
  transition: all 0.3s;
  font-family: 'Cairo', sans-serif;
  font-weight: 600;
}
.quote-refresh:hover {
  background: var(--purple);
  color: #fff;
  border-color: var(--purple);
}

/* ================= Grid Gallery ================= */
.grid-section {
  margin-top: 20px;
  padding: 0 20px;
}
.grid-title {
  font-family: 'Cairo', sans-serif;
  font-size: 13px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.grid-title i { color: var(--purple-light); font-size: 12px; }

.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 3px;
  border-radius: 12px;
  overflow: hidden;
}
.grid-item {
  aspect-ratio: 1;
  overflow: hidden;
  position: relative;
  cursor: pointer;
  background: var(--screen-2);
}
.grid-item img {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.5s ease;
}
.grid-item:hover img { transform: scale(1.15); }
.grid-item::after {
  content: '\f00e';
  font-family: 'Font Awesome 6 Free';
  font-weight: 900;
  position: absolute;
  inset: 0;
  background: rgba(124,58,237,0.6);
  display: grid;
  place-items: center;
  color: #fff;
  font-size: 18px;
  opacity: 0;
  transition: opacity 0.3s;
}
.grid-item:hover::after { opacity: 1; }

/* ================= Bottom Navigation ================= */
.bottom-nav {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 72px;
  background: rgba(15,15,26,0.9);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-around;
  padding: 0 10px 8px;
  z-index: 10;
  border-radius: 0 0 38px 38px;
}
.nav-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  background: none;
  border: none;
  color: var(--dim);
  font-size: 9px;
  font-family: 'Cairo', sans-serif;
  cursor: pointer;
  transition: color 0.3s;
  padding: 6px 0;
}
.nav-item i {
  font-size: 16px;
  transition: transform 0.3s;
}
.nav-item:hover, .nav-item.active {
  color: var(--purple-light);
}
.nav-item.active i {
  transform: translateY(-2px);
  filter: drop-shadow(0 0 6px var(--purple));
}
.nav-item.add-btn {
  flex: 0 0 48px;
}
.nav-item.add-btn i {
  width: 42px; height: 42px;
  background: linear-gradient(135deg, var(--purple), var(--blue));
  border-radius: 14px;
  display: grid;
  place-items: center;
  color: #fff;
  font-size: 16px;
  box-shadow: 0 4px 14px rgba(124,58,237,0.5);
}
.nav-item.add-btn:hover i {
  transform: rotate(90deg) scale(1.08);
}

/* ================= Responsive ================= */
@media (max-width: 500px) {
  body { padding: 15px 8px; }
  .phone {
    width: 100%;
    max-width: 360px;
    height: 720px;
    border-radius: 40px;
    padding: 10px;
  }
  .screen { border-radius: 32px; }
  .bottom-nav { border-radius: 0 0 32px 32px; }
  .profile-name { font-size: 20px; }
  .avatar-lg { width: 90px; height: 90px; }
  .stories { padding: 15px 16px 0; }
  .grid-section { padding: 0 16px; }
  .info-row { padding: 0 16px; }
  .quote-card { margin: 18px 16px 0; }
}

@media (max-height: 800px) and (min-width: 501px) {
  .phone { height: 720px; }
}
</style>
</head>

<script>
/* ============ Live Clock ============ */
function updateClock() {
  const now = new Date();
  const h = now.getHours();
  const m = String(now.getMinutes()).padStart(2,'0');
  document.getElementById('clock').textContent = h + ':' + m;
}
updateClock();
setInterval(updateClock, 1000);

/* ============ Title of the day ============ */
const titles = ['ملكة', 'أميرة', 'نجمة', 'فراشة', 'قمر', 'ياقوتة'];
document.getElementById('titleOfDay').textContent = titles[new Date().getDate() % titles.length];

/* ============ Mood ============ */
const moods = [
  { t: 'سعيدة', i: 'fa-face-smile' },
  { t: 'رايقة', i: 'fa-face-grin-stars' },
  { t: 'مبسوطة', i: 'fa-face-laugh-beam' },
  { t: 'حالمة', i: 'fa-face-grin-hearts' },
  { t: 'متحمسة', i: 'fa-face-grin-tongue-wink' },
];
const m = moods[new Date().getDate() % moods.length];
document.getElementById('moodText').textContent = m.t;
document.getElementById('moodIcon').className = 'fas ' + m.i;

/* ============ Random Quote ============ */
const quotesList = [
  'أحبك فقط بسبب شخصيتك، وليس لما تمتلكه 💖',
  'كوني وردة في زحمة العابرين 🌹',
  'الحب الحقيقي يخليك أحسن نسخة من نفسك ✨',
  'ابتسمي، فالدنيا جميلة بوجودك 🌸',
  'أنتِ أقوى مما تتخيلي وأجمل مما تتصوري 💫',
  'كوني نفسك، فأنتِ فريدة من نوعك 💎',
  'قلبك أبيض، وده أجمل حاجة فيك 🤍',
];
document.getElementById('quoteBtn').addEventListener('click', () => {
  const q = document.getElementById('quoteText');
  const pick = quotesList[Math.floor(Math.random() * quotesList.length)];
  q.style.opacity = '0';
  setTimeout(() => { q.innerHTML = pick; q.style.opacity = '1'; }, 220);
});

/* ============ Bottom nav active toggle ============ */
document.querySelectorAll('.nav-item').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
});
</script>
